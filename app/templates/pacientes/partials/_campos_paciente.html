<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    {% set input_class = 'w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition' %}
    <div class="space-y-2"><label for="nombre" class="block text-sm font-medium text-gray-700">Nombre(s)</label><input class="{{ input_class }}" id="nombre" name="nombre" required minlength="2" maxlength="60" value="{{ request.form.get('nombre', paciente.nombre if paciente else '') }}"></div>
    <div class="space-y-2"><label for="apellido_paterno" class="block text-sm font-medium text-gray-700">Apellido paterno</label><input class="{{ input_class }}" id="apellido_paterno" name="apellido_paterno" required minlength="2" maxlength="60" value="{{ request.form.get('apellido_paterno', paciente.apellido_paterno if paciente else '') }}"></div>
    <div class="space-y-2"><label for="apellido_materno" class="block text-sm font-medium text-gray-700">Apellido materno <span class="text-gray-400">(opcional)</span></label><input class="{{ input_class }}" id="apellido_materno" name="apellido_materno" maxlength="60" value="{{ request.form.get('apellido_materno', paciente.apellido_materno if paciente and paciente.apellido_materno else '') }}"></div>
    <div class="space-y-2"><label for="genero" class="block text-sm font-medium text-gray-700">Género</label><select class="{{ input_class }}" id="genero" name="genero" required>{% set genero = request.form.get('genero', paciente.genero if paciente else '') %}<option value="">Seleccione...</option><option value="hombre" {% if genero == 'hombre' %}selected{% endif %}>Hombre</option><option value="mujer" {% if genero == 'mujer' %}selected{% endif %}>Mujer</option><option value="otro" {% if genero == 'otro' %}selected{% endif %}>Otro</option><option value="prefiero_no_decir" {% if genero == 'prefiero_no_decir' %}selected{% endif %}>Prefiero no decir</option></select></div>
    <div class="space-y-2"><label for="fecha_nacimiento" class="block text-sm font-medium text-gray-700">Fecha de nacimiento</label><input class="{{ input_class }}" type="date" min="1900-01-01" id="fecha_nacimiento" name="fecha_nacimiento" required value="{{ request.form.get('fecha_nacimiento', paciente.fecha_nacimiento.isoformat() if paciente and paciente.fecha_nacimiento else '') }}"></div>
    <div class="space-y-2"><label for="telefono" class="block text-sm font-medium text-gray-700">Teléfono</label><input class="{{ input_class }}" type="tel" inputmode="numeric" id="telefono" name="telefono" required maxlength="10" pattern="[0-9]{10}" value="{{ request.form.get('telefono', paciente.telefono if paciente else '') }}"></div>
    <div class="space-y-2"><label for="correo" class="block text-sm font-medium text-gray-700">Correo <span class="text-gray-400">(opcional)</span></label><input class="{{ input_class }}" type="email" id="correo" name="correo" maxlength="254" value="{{ request.form.get('correo', paciente.correo if paciente and paciente.correo else '') }}"></div>
    <div class="space-y-2"><label for="ocupacion" class="block text-sm font-medium text-gray-700">Ocupación</label><input class="{{ input_class }}" id="ocupacion" name="ocupacion" maxlength="120" value="{{ request.form.get('ocupacion', paciente.ocupacion if paciente and paciente.ocupacion else '') }}"></div>
    <div class="space-y-2"><label for="ciudad" class="block text-sm font-medium text-gray-700">Ciudad</label><input class="{{ input_class }}" id="ciudad" name="ciudad" required maxlength="100" value="{{ request.form.get('ciudad', paciente.ciudad if paciente else '') }}"></div>
    <div class="space-y-2"><label for="direccion" class="block text-sm font-medium text-gray-700">Dirección</label><input class="{{ input_class }}" id="direccion" name="direccion" maxlength="250" value="{{ request.form.get('direccion', paciente.direccion if paciente and paciente.direccion else '') }}"></div>
    <div class="space-y-2"><label for="contacto_emergencia" class="block text-sm font-medium text-gray-700">Contacto de emergencia</label><input class="{{ input_class }}" id="contacto_emergencia" name="contacto_emergencia" maxlength="120" value="{{ request.form.get('contacto_emergencia', paciente.contacto_emergencia if paciente and paciente.contacto_emergencia else '') }}"></div>
    <div class="space-y-2"><label for="telefono_emergencia" class="block text-sm font-medium text-gray-700">Teléfono de emergencia</label><input class="{{ input_class }}" type="tel" inputmode="numeric" id="telefono_emergencia" name="telefono_emergencia" maxlength="10" pattern="[0-9]{10}" value="{{ request.form.get('telefono_emergencia', paciente.telefono_emergencia if paciente and paciente.telefono_emergencia else '') }}"></div>
</div>
