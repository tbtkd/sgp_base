<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error {{ status_code }}</title>
    <style nonce="{{ csp_nonce }}">
        body { font-family: system-ui, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f8fafc; color: #0f172a; }
        main { max-width: 36rem; margin: 1rem; padding: 2rem; border: 1px solid #e2e8f0; border-radius: 1rem; background: white; box-shadow: 0 10px 30px rgba(15,23,42,.08); }
        a { color: #0f766e; }
    </style>
</head>
<body>
    <main>
        <h1>No fue posible completar la solicitud ({{ status_code }})</h1>
        <p>{{ message }}</p>
        <a href="{{ url_for('main.index') if current_user.is_authenticated else url_for('auth.login') }}">Volver</a>
    </main>
</body>
</html>
