<!-- Tab 2: Reagendamiento -->
<table class="w-full text-sm text-left border-collapse relative">
    <thead class="text-xs text-gray-500 uppercase bg-gray-50 sticky top-0 z-10">
        <tr>
            <th class="px-6 py-4 font-medium">PACIENTE</th>
            <th class="px-6 py-4 font-medium">ÚLTIMA CITA</th>
            <th class="px-6 py-4 font-medium">TIEMPO TRANSCURRIDO</th>
            <th class="px-6 py-4 font-medium text-right">ACCIÓN</th>
        </tr>
    </thead>
    <tbody class="divide-y divide-gray-100">
        {% for p in pendientes_por_agendar %}
        <tr class="bg-white hover:bg-gray-50/50 transition-colors">
            <td class="px-6 py-5 font-medium text-gray-900">{{ p.nombre }} {{ p.apellido_paterno }}</td>
            <td class="px-6 py-5 text-gray-600">
                <span class="font-medium text-gray-800">{{ p.ultima_cita|format_date }}</span>
            </td>
            <td class="px-6 py-5 text-gray-600">
                <span class="text-amber-600 font-medium">Hace {{ p.dias_transcurridos|int }} días</span>
            </td>
            <td class="px-6 py-5 text-right min-w-[150px] whitespace-nowrap">
                <div class="flex items-center justify-end gap-2.5">
                    <a href="{{ url_for('pacientes.detalle_paciente', id=p.id) }}" class="text-teal-600 hover:text-teal-900 font-medium bg-teal-50 hover:bg-teal-100 px-4 py-2 rounded-lg transition">Agendar Cita</a>
                </div>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
