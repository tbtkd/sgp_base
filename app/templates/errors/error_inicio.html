<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Pacientes - Abierto</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100/80 flex items-center justify-center min-h-screen p-4 font-sans select-none">

    <div class="bg-white rounded-2xl shadow-2xl border border-gray-100 max-w-sm w-full p-6 text-center transform transition-all">
        <!-- Ícono Destacado (Pestaña / Navegador) -->
        <div class="w-14 h-14 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl shadow-inner">
            <i class="fas fa-window-restore"></i>
        </div>

        <!-- Título y Mensaje orientados a pestañas del Navegador -->
        <h2 class="text-lg font-bold text-gray-900 tracking-tight">El sistema ya está abierto</h2>
        <p class="text-sm text-gray-600 mt-2 leading-relaxed">
            La aplicación ya se encuentra activa en otra pestaña o ventana de tu navegador web. Revisa tus pestañas abiertas para continuar utilizando el sistema.
        </p>

        <!-- Botón de Acción -->
        <div class="mt-6">
            <button onclick="window.close()" class="w-full py-2.5 px-4 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-sm rounded-xl shadow transition-colors focus:outline-none">
                Entendido
            </button>
        </div>
    </div>

</body>
</html>
