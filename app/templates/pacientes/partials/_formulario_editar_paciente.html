<form id="form-editar-paciente" action="{{ url_for('pacientes.editar_paciente', id=paciente.id) }}" method="POST" class="space-y-6">
    {% include 'pacientes/partials/_campos_paciente.html' %}
    <div class="space-y-2">
        <label for="status" class="block text-sm font-medium text-gray-700">Estado</label>
        <select id="status" name="status" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-teal-500">
            <option value="activo" {% if request.form.get('status', paciente.status) == 'activo' %}selected{% endif %}>Activo</option>
            <option value="inactivo" {% if request.form.get('status', paciente.status) == 'inactivo' %}selected{% endif %}>Inactivo</option>
        </select>
    </div>
    <div class="flex items-center justify-end gap-4 pt-6 border-t border-gray-100">
        <a href="{{ url_for('pacientes.detalle_paciente', id=paciente.id) }}" class="px-6 py-3 text-gray-600 hover:text-gray-900 font-medium transition">Cancelar</a>
        <button type="submit" class="px-8 py-3 bg-teal-600 hover:bg-teal-700 text-white font-semibold rounded-xl shadow-sm transition">Guardar cambios</button>
    </div>
</form>
