<div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3 my-6 no-print">
    {% if current_user.rol_clinico in ['admin', 'medico'] %}
    <a href="{{ url_for('valoracion.nueva_valoracion', paciente_id=paciente.id) }}" class="px-3 py-2.5 rounded-2xl text-xs font-semibold flex items-center justify-center gap-2 bg-teal-600 text-white"><i class="fas fa-stethoscope"></i>Nueva consulta</a>
    <a href="{{ url_for('historial_clinico.ver_crear_historial', paciente_id=paciente.id) }}" class="px-3 py-2.5 rounded-2xl text-xs font-semibold flex items-center justify-center gap-2 bg-white border"><i class="fas fa-notes-medical"></i>Expediente</a>
    {% if ultima_valoracion %}<a href="{{ url_for('valoracion.detalle_valoracion', valoracion_id=ultima_valoracion.id) }}" class="px-3 py-2.5 rounded-2xl text-xs font-semibold flex items-center justify-center gap-2 bg-white border"><i class="fas fa-file-medical"></i>Última consulta</a>{% endif %}
    <button type="button" id="btnOpenExcelModal" class="px-3 py-2.5 rounded-2xl text-xs font-semibold bg-white border"><i class="fas fa-file-excel text-emerald-600 mr-1"></i>Importar Excel</button>
    {% endif %}
    <a href="{{ paciente.whatsapp_url }}" target="_blank" rel="noopener noreferrer" class="px-3 py-2.5 rounded-2xl text-xs font-semibold flex items-center justify-center gap-2 bg-emerald-600 text-white"><i class="fab fa-whatsapp"></i>WhatsApp</a>
    <button type="button" onclick="abrirBitacoraWhatsApp()" class="px-3 py-2.5 rounded-2xl text-xs font-semibold bg-white border"><i class="fas fa-list mr-1"></i>Bitácora</button>
</div>

<div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8 no-print">
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
        <h3 class="text-lg font-semibold mb-4"><i class="fas fa-receipt text-teal-600 mr-2"></i>Registrar pago</h3>
        <form action="{{ url_for('pacientes.registrar_pago_paciente', id=paciente.id) }}" method="POST" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div><label for="fecha_pago" class="block text-sm font-medium mb-1">Fecha</label><input type="date" id="fecha_pago" name="fecha_pago" class="w-full rounded-xl border-gray-200" required></div>
            <div><label for="monto" class="block text-sm font-medium mb-1">Monto</label><input type="number" id="monto" name="monto" min="0" step="0.01" class="w-full rounded-xl border-gray-200" required></div>
            <div><label for="concepto" class="block text-sm font-medium mb-1">Concepto</label><input id="concepto" name="concepto" maxlength="200" class="w-full rounded-xl border-gray-200" required></div>
            <div><label for="metodo_pago" class="block text-sm font-medium mb-1">Método</label><select id="metodo_pago" name="metodo_pago" class="w-full rounded-xl border-gray-200" required><option value="efectivo">Efectivo</option><option value="tarjeta">Tarjeta</option><option value="transferencia">Transferencia</option><option value="otro">Otro</option></select></div>
            <button type="submit" class="md:col-span-2 py-3 bg-teal-600 text-white rounded-xl font-semibold">Registrar pago</button>
        </form>
    </div>
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex flex-col justify-between">
        <div><h3 class="text-lg font-semibold mb-4"><i class="fas fa-calendar-plus text-teal-600 mr-2"></i>Próxima cita</h3><p class="text-sm text-gray-500">Agenda o actualiza la próxima atención del paciente.</p></div>
        <button type="button" id="btnOpenModal" class="mt-5 w-full py-3 bg-white border border-gray-200 rounded-xl font-semibold">Registrar / actualizar</button>
    </div>
</div>
