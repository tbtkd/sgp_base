<div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm flex flex-wrap items-center justify-between gap-4 mb-6 text-sm">
    <div class="flex items-center gap-6">
        <div class="flex items-center gap-2">
            <span class="text-gray-500">Cita:</span>
            <span class="font-bold text-gray-900">#{{ valoracion['numero_cita'] }}</span>
        </div>
        <div class="flex items-center gap-2">
            <span class="text-gray-500">Fecha:</span>
            <span class="font-medium text-gray-900">{{ valoracion['fecha']|format_date }}</span>
        </div>
    </div>
    <div class="flex items-center gap-6">
        <div class="flex items-center gap-2">
            <span class="text-gray-500">Peso:</span>
            <span class="font-bold text-teal-600">{{ valoracion['peso'] }} kg</span>
        </div>
        <div class="flex items-center gap-2">
            <span class="text-gray-500">IMC:</span>
            <span class="font-bold text-gray-900">{{ valoracion['imc'] }}</span>
        </div>
        <div class="flex items-center gap-2">
            <span class="text-gray-500">% Grasa:</span>
            <span class="font-bold text-gray-900">{{ valoracion['grasa'] }}%</span>
        </div>
    </div>
</div>
