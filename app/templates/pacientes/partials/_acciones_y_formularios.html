<!-- Acciones -->
<div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3 my-6">
    <a href="{{ url_for('valoracion.nueva_valoracion', paciente_id=paciente['id']) }}" class="px-3 py-2.5 rounded-2xl text-xs font-semibold flex items-center justify-center gap-1.5 transition-all shadow-sm whitespace-nowrap bg-emerald-600 text-white hover:bg-emerald-700">
        <i class="fas fa-plus-circle"></i> Nueva Valoración
    </a>
    {% if ultima_valoracion %}
    <a href="{{ url_for('valoracion.detalle_valoracion', valoracion_id=ultima_valoracion['id']) }}" class="px-3 py-2.5 rounded-2xl text-xs font-semibold flex items-center justify-center gap-1.5 transition-all shadow-sm whitespace-nowrap bg-white border border-gray-200 text-gray-700 hover:bg-gray-50">
        <i class="fas fa-eye"></i> Última Valoración
    </a>
    {% else %}
    <button disabled class="px-3 py-2.5 rounded-2xl text-xs font-semibold flex items-center justify-center gap-1.5 transition-all shadow-sm whitespace-nowrap bg-gray-50 border border-gray-200 text-gray-400 cursor-not-allowed">
        <i class="fas fa-eye-slash"></i> Sin Valoraciones
    </button>
    {% endif %}
    <a href="{{ url_for('historial_clinico.ver_crear_historial', paciente_id=paciente['id']) }}" class="px-3 py-2.5 rounded-2xl text-xs font-semibold flex items-center justify-center gap-1.5 transition-all shadow-sm whitespace-nowrap bg-white border border-gray-200 text-gray-700 hover:bg-gray-50">
        <i class="fas fa-notes-medical"></i> Historial Clínico
    </a>
    <button onclick="abrirBitacoraWhatsApp()" class="px-3 py-2.5 rounded-2xl text-xs font-semibold flex items-center justify-center gap-1.5 transition-all shadow-sm whitespace-nowrap bg-white border border-gray-200 text-gray-700 hover:bg-gray-50">
        <i class="fab fa-whatsapp text-emerald-600"></i> Bitácora WhatsApp
        {% if paciente.bitacoras|length > 0 %}
        <span class="bg-emerald-600 text-white text-[10px] px-1.5 py-0.2 rounded-full font-bold ml-1">{{ paciente.bitacoras|length }}</span>
        {% endif %}
    </button>
    <button type="button" id="btnOpenExcelModal" class="px-3 py-2.5 rounded-2xl text-xs font-semibold flex items-center justify-center gap-1.5 transition-all shadow-sm whitespace-nowrap bg-white border border-gray-200 text-gray-700 hover:bg-gray-50">
        <i class="fas fa-file-excel text-emerald-600"></i> Cargar Excel
    </button>
</div>

<!-- Secciones Adicionales -->
<div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8 items-stretch">
    <!-- Registrar Pago -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex flex-col">
        <h3 class="text-lg font-semibold text-gray-900 mb-4"><i class="fas fa-calendar text-teal-600 mr-2"></i> Registrar Fecha Pago</h3>
        <form action="{{ url_for('pacientes.registrar_pago_paciente', id=paciente['id']) }}" method="POST" class="space-y-4 flex-grow flex flex-col justify-between">
            <div>
                <label for="fecha_pago" class="block text-sm font-medium text-gray-700 mb-1">Fecha de Pago:</label>
                <input type="date" id="fecha_pago" name="fecha_pago" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition" required>
            </div>
            <button type="submit" class="w-full py-3 px-4 bg-teal-600 hover:bg-teal-700 text-white rounded-xl font-medium transition">Registrar Pago</button>
        </form>
    </div>
    
    <!-- Registrar Dieta -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex flex-col">
        <h3 class="text-lg font-semibold text-gray-900 mb-4"><i class="fas fa-apple-alt text-teal-600 mr-2"></i> Registrar Última Dieta</h3>
        <form action="{{ url_for('pacientes.detalle_paciente', id=paciente['id']) }}" method="POST" class="space-y-4 flex-grow flex flex-col justify-between">
            <div>
                <label for="ultima_dieta" class="block text-sm font-medium text-gray-700 mb-1">Última Dieta:</label>
                <input type="text" id="ultima_dieta" name="ultima_dieta" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition" maxlength="8" required>
            </div>
            <button type="submit" class="w-full py-3 px-4 bg-teal-600 hover:bg-teal-700 text-white rounded-xl font-medium transition">Registrar Dieta</button>
        </form>
    </div>
    
    <!-- Registrar Cita -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex flex-col">
        <h3 class="text-lg font-semibold text-gray-900 mb-4"><i class="fas fa-calendar-plus text-teal-600 mr-2"></i> Próxima Cita</h3>
        <div class="space-y-4 flex-grow flex flex-col justify-between">
            <p class="text-sm text-gray-500">Gestionar la próxima cita del paciente:</p>
            <button type="button" id="btnOpenModal" class="w-full py-3 px-4 bg-white border border-gray-200 hover:bg-gray-50 text-gray-700 rounded-xl font-medium transition">
                <i class="fas fa-calendar-plus mr-2"></i> Registrar / Actualizar
            </button>
        </div>
    </div>
</div>
