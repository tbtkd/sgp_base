[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["browser: pruebas E2E opcionales con Playwright y Chromium"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "SIM"]
ignore = ["E501", "S105", "S110"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106", "S107"]
