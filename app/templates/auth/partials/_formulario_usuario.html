<form id="form-registrar-usuario" action="{{ url_for('auth.registrar_usuario') }}" method="POST" class="space-y-6" data-user-professional-form>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Nombre -->
        <div class="space-y-2">
            <label for="nombre" class="block text-sm font-medium text-gray-700">Nombre</label>
            <input type="text" id="nombre" name="nombre" required minlength="2" maxlength="30" pattern="[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+"
                   class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition"
                   placeholder="Nombre(s)"
                   value="{{ request.form.nombre or '' }}">
        </div>

        <!-- Apellido Paterno -->
        <div class="space-y-2">
            <label for="apellido_paterno" class="block text-sm font-medium text-gray-700">Apellido Paterno</label>
            <input type="text" id="apellido_paterno" name="apellido_paterno" required minlength="2" maxlength="30" pattern="[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+"
                   class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition"
                   placeholder="Apellido paterno"
                   value="{{ request.form.apellido_paterno or '' }}">
        </div>

        <!-- Apellido Materno -->
        <div class="space-y-2">
            <label for="apellido_materno" class="block text-sm font-medium text-gray-700">Apellido Materno</label>
            <input type="text" id="apellido_materno" name="apellido_materno" required minlength="2" maxlength="30" pattern="[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+"
                   class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition"
                   placeholder="Apellido materno"
                   value="{{ request.form.apellido_materno or '' }}">
        </div>

        <!-- Usuario -->
        <div class="space-y-2">
            <label for="username" class="block text-sm font-medium text-gray-700">Nombre de Usuario</label>
            <input type="text" id="username" name="username" required minlength="3" maxlength="50" pattern="[a-zA-Z0-9._-]+" autocomplete="username"
                   class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition"
                   placeholder="Nombre de usuario"
                   value="{{ request.form.username or '' }}">
        </div>

        <!-- Correo -->
        <div class="space-y-2">
            <label for="email" class="block text-sm font-medium text-gray-700">Correo Electrónico</label>
            <input type="email" id="email" name="email" required maxlength="40"
                   class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition"
                   placeholder="ejemplo@correo.com"
                   value="{{ request.form.email or '' }}">
        </div>

        <!-- Rol -->
        <div class="space-y-2">
            <label for="rol" class="block text-sm font-medium text-gray-700">Rol</label>
            <select id="rol" name="rol" required
                    class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition">
                <option value="admin" {% if request.form.rol == 'admin' %}selected{% endif %}>Administrador</option>
                <option value="medico" {% if request.form.rol == 'medico' %}selected{% endif %}>Médico / Profesional clínico</option>
                <option value="recepcion" {% if request.form.rol == 'recepcion' %}selected{% endif %}>Recepción</option>
            </select>
        </div>

        <div class="space-y-2" data-professional-profile-field>
            <label for="perfil_profesional" class="block text-sm font-medium text-gray-700">Perfil clínico / área de atención</label>
            <select id="perfil_profesional" name="perfil_profesional"
                    class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition">
                <option value="" {% if not request.form.perfil_profesional %}selected{% endif %}>No aplica</option>
                <option value="medico_general" {% if request.form.perfil_profesional == 'medico_general' %}selected{% endif %}>Médico general</option>
                <option value="dentista" {% if request.form.perfil_profesional == 'dentista' %}selected{% endif %}>Dentista / Cirujano dentista</option>
                <option value="nutricion" {% if request.form.perfil_profesional == 'nutricion' %}selected{% endif %}>Nutrición / Nutriólogo(a)</option>
            </select>
            <p class="text-xs text-gray-500">Obligatorio para el rol Médico / Profesional clínico. Sólo Nutrición habilita antropometría.</p>
        </div>

        <!-- Cédula profesional -->
        <div class="space-y-2" data-professional-license-field>
            <label for="cedula_profesional" class="block text-sm font-medium text-gray-700">Cédula Profesional <span class="text-gray-400 text-xs">(Requerida para emitir receta)</span></label>
            <input type="text" id="cedula_profesional" name="cedula_profesional" minlength="5" maxlength="12" pattern="[0-9]{5,12}" inputmode="numeric"
                   class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition"
                   placeholder="Número de cédula"
                   value="{{ request.form.cedula_profesional or '' }}">
        </div>

        <div class="space-y-2" data-professional-details-field>
            <label for="nombre_establecimiento" class="block text-sm font-medium text-gray-700">Nombre del establecimiento <span class="text-gray-400 text-xs">(Opcional)</span></label>
            <input type="text" id="nombre_establecimiento" name="nombre_establecimiento" maxlength="160"
                   class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition"
                   placeholder="Consultorio, clínica o institución"
                   value="{{ request.form.nombre_establecimiento or '' }}">
        </div>

        <div class="space-y-2 md:col-span-2" data-professional-details-field>
            <label for="domicilio_profesional" class="block text-sm font-medium text-gray-700">Domicilio profesional completo <span class="text-gray-400 text-xs">(Requerido para emitir receta)</span></label>
            <input type="text" id="domicilio_profesional" name="domicilio_profesional" maxlength="300"
                   class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition"
                   placeholder="Calle, número, colonia, C.P., municipio/alcaldía y entidad"
                   value="{{ request.form.domicilio_profesional or '' }}">
            <p class="text-xs text-gray-500">El sistema bloquea la receta ordinaria si el profesional no tiene cédula y domicilio completos.</p>
        </div>

        <!-- Contraseña -->
        <div class="space-y-2 md:col-span-2">
            <label for="password" class="block text-sm font-medium text-gray-700">Contraseña</label>
            <input type="password" id="password" name="password" required minlength="12" maxlength="128" autocomplete="new-password"
                   class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition"
                   placeholder="12+ caracteres, mayúscula, minúscula, número y símbolo">
        </div>
    </div>

    <!-- Botones -->
    <div class="flex items-center justify-end gap-4 pt-6 border-t border-gray-100">
        <a href="{{ url_for('main.index') }}" class="px-6 py-3 text-gray-600 hover:text-gray-900 font-medium transition">Cancelar</a>
        <button type="submit" class="px-8 py-3 bg-teal-600 hover:bg-teal-700 text-white font-semibold rounded-xl shadow-sm hover:shadow transition">
            Registrar Usuario
        </button>
    </div>
</form>
